name: Build Kernel LMI (Auto Setup)

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: 'Kernel repo URL'
        required: true
        default: 'https://github.com/Prabuelsi20/kernel_xiaomi_sm8250-Nesux-Alioth-Test'
      KERNEL_BRANCH:
        description: 'Branch'
        required: true
        default: 'A16m-mglru'
      COMPILER:
        description: 'Compiler'
        required: true
        type: choice
        options:
          - neutron
          - r574158
        default: neutron
      CUSTOM_VERSION:
        description: 'Version suffix'
        default: '-Nexus-LMI'
      FIX_ERRATA:
        description: 'Disable problematic errata (fix cpu_errata.c error)'
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'yes'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y flex libncurses6 bc cpio python3

      - name: Setup compiler (Neutron)
        if: ${{ github.event.inputs.COMPILER == 'neutron' }}
        run: |
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst -O clang.tar.zst
          mkdir clang
          unzstd -d clang.tar.zst
          tar -xf clang.tar -C clang

      - name: Setup compiler (r574158)
        if: ${{ github.event.inputs.COMPILER == 'r574158' }}
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/ebcc6c3bef363bc539ea39f45b6abae1dce6ff1a/clang-r574158.tar.gz -O clang.tar.gz
          mkdir clang
          tar -xf clang.tar.gz -C clang

      - name: Clone kernel with submodules
        run: |
          git clone --recurse-submodules --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ github.event.inputs.KERNEL_REPO }} \
            kernel

      - name: Ensure KernelSU exists
        run: |
          cd kernel
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            rm -rf drivers/kernelsu
            git clone https://github.com/tiann/KernelSU.git drivers/kernelsu
          fi

      - name: Fix errata (optional)
        if: ${{ github.event.inputs.FIX_ERRATA == 'yes' }}
        run: |
          cd kernel
          # Disable all ARM64_ERRATUM that might cause cpu_errata.c error
          sed -i '/CONFIG_ARM64_ERRATUM_1542418/d' arch/arm64/configs/vendor/lmi_defconfig
          sed -i '/CONFIG_ARM64_ERRATUM_1024718/d' arch/arm64/configs/vendor/lmi_defconfig
          sed -i '/CONFIG_ARM64_ERRATUM_843419/d' arch/arm64/configs/vendor/lmi_defconfig
          # Also disable CONFIG_ARM64_ERRATUM_* that use MIDR_ALL_VERSIONS with non-existent models
          # (we'll just comment out all CONFIG_ARM64_ERRATUM_* lines to be safe)
          sed -i '/CONFIG_ARM64_ERRATUM_/d' arch/arm64/configs/vendor/lmi_defconfig
          echo "# CONFIG_ARM64_ERRATUM_1024718 is not set" >> arch/arm64/configs/vendor/lmi_defconfig
          echo "# CONFIG_ARM64_ERRATUM_1542418 is not set" >> arch/arm64/configs/vendor/lmi_defconfig

      - name: Set kernel version
        run: |
          cd kernel
          sed -i "s/CONFIG_LOCALVERSION=\"[^\"]*\"/CONFIG_LOCALVERSION=\"${{ github.event.inputs.CUSTOM_VERSION }}\"/" \
            arch/arm64/configs/vendor/lmi_defconfig

      - name: Build kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="lmi-builder"
          export KBUILD_BUILD_HOST="github"
          cd kernel
          make O=out vendor/lmi_defconfig
          make O=out CC=clang -j$(nproc --all) \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp kernel/out/arch/arm64/boot/Image.gz artifacts/
          cp kernel/out/arch/arm64/boot/dtbo.img artifacts/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/dtb.img artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lmi-kernel-build
          path: artifacts/
